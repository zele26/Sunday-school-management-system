apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: church-frontend-route
  namespace: church-production
  labels:
    app.kubernetes.io/name: church-frontend
    app.kubernetes.io/component: ui
  annotations:
    haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains;preload
spec:
  host: sunday-school.apps.yourdomain.com
  to:
    kind: Service
    name: church-frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
