apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-store
  namespace: church-production
spec:
  provider:
    vault:
      server: "https://vault.yourdomain.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "church-backend-role"
          secretRef:
            name: "vault-auth-service-account-token"
            key: "token"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: church-backend-vault-secrets
  namespace: church-production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend-store
    kind: SecretStore
  target:
    name: church-backend-vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: church-project/production
        property: MONGO_URI
    - secretKey: JWT_SECRET
      remoteRef:
        key: church-project/production
        property: JWT_SECRET
    - secretKey: REFRESH_TOKEN_SECRET
      remoteRef:
        key: church-project/production
        property: REFRESH_TOKEN_SECRET
    - secretKey: CLOUDINARY_CLOUD_NAME
      remoteRef:
        key: church-project/production
        property: CLOUDINARY_CLOUD_NAME
    - secretKey: CLOUDINARY_API_KEY
      remoteRef:
        key: church-project/production
        property: CLOUDINARY_API_KEY
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: church-project/production
        property: CLOUDINARY_API_SECRET
