<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Ethiopian Orthodox Cross Motif -->
  <!-- Vertical Beam -->
  <rect x="46.5" y="16" width="7" height="68" rx="2" fill="url(#goldGrad)" />
  <!-- Horizontal Beam -->
  <rect x="22" y="36" width="56" height="7" rx="2" fill="url(#goldGrad)" />

  <!-- Center Accent -->
  <circle cx="50" cy="39.5" r="7" fill="#1E3A8A" stroke="#FBBF24" stroke-width="2" />
  <circle cx="50" cy="39.5" r="3" fill="#FBBF24" />

  <!-- Cross End Ornaments -->
  <!-- Top -->
  <circle cx="50" cy="16" r="4.5" fill="url(#goldGrad)" />
  <circle cx="44" cy="19" r="3" fill="url(#goldGrad)" />
  <circle cx="56" cy="19" r="3" fill="url(#goldGrad)" />

  <!-- Bottom -->
  <circle cx="50" cy="84" r="4.5" fill="url(#goldGrad)" />
  <circle cx="44" cy="81" r="3" fill="url(#goldGrad)" />
  <circle cx="56" cy="81" r="3" fill="url(#goldGrad)" />

  <!-- Left -->
  <circle cx="22" cy="39.5" r="4.5" fill="url(#goldGrad)" />
  <circle cx="25" cy="33.5" r="3" fill="url(#goldGrad)" />
  <circle cx="25" cy="45.5" r="3" fill="url(#goldGrad)" />

  <!-- Right -->
  <circle cx="78" cy="39.5" r="4.5" fill="url(#goldGrad)" />
  <circle cx="75" cy="33.5" r="3" fill="url(#goldGrad)" />
  <circle cx="75" cy="45.5" r="3" fill="url(#goldGrad)" />
</svg>