version: '3.8'

services:
  backend:
    image: zelalemzola/sunday-backend:latest
    build:
      context: ./church-server
    container_name: church-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://<db_user>:<db_password>@cluster.mongodb.net/church_db}
      - JWT_SECRET=${JWT_SECRET:-<your-jwt-secret-key>}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-<your-refresh-token-secret-key>}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-<your-cloudinary-cloud-name>}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-<your-cloudinary-api-key>}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-<your-cloudinary-api-secret>}

  frontend:
    image: zelalemzola/sunday-frontend:latest
    build:
      context: ./church-system
    container_name: church-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
